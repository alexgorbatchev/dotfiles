name: CI

on:
  pull_request:
  push:
    branches:
      - "**"
    tags-ignore:
      - "v*"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Setup Just
        uses: taiki-e/install-action@just

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate embedded assets
        run: just prepare

      - name: Run checks
        run: bun run check:ci

      # The full release build is deliberately not part of `just check`, which is
      # the gate run locally on every iteration: it cross-compiles every target
      # and rebuilds the dashboard bundle, and it rewrites generated sources and
      # .dist, which stops every package that loads a TypeScript configuration
      # from reusing a cached test result. It runs here, after the checks, so
      # they see a tree it has not rewritten.
      - name: Run the full release build
        run: just test-build
