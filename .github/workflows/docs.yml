name: Deploy Docs and Hosted Installer to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - "scripts/managed-installer/install.sh"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Prepare Pages Artifacts
        run: |
          mkdir -p public
          cp scripts/managed-installer/install.sh public/install.sh

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: "public"

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
